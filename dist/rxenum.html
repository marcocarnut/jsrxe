<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rxenum</title>
<style>
:root {
  --bg: #fbfaf7; --fg: #1c1b18; --dim: #6b6862; --line: #ddd9d0;
  --panel: #fff; --accent: #7a4f1d; --accent-bg: #f3ece1; --err: #8a2b12;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16151a; --fg: #e8e6e1; --dim: #9a968e; --line: #33313a;
    --panel: #1e1d23; --accent: #d8a668; --accent-bg: #2a2620; --err: #e08a70;
  }
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
}

header { display: flex; align-items: baseline; flex-wrap: wrap;
         gap: .1rem .55rem; padding: .9rem 1.4rem .7rem; }
header h1 { margin: 0; font-size: 1.4rem; letter-spacing: -.01em; }
header .sep { color: var(--dim); font-weight: 300; }
header .sub { color: var(--dim); font-size: .95rem; }
header .repo { font-size: .88rem; }
#lang {
  margin-left: auto; align-self: center;
  background: var(--panel); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: .2rem .4rem;
  font-size: .85rem;
}

main {
  display: grid; grid-template-columns: 20rem 1fr; gap: 1rem;
  padding: .9rem 1.4rem 3rem; align-items: start;
}
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }

.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 9px; padding: .85rem 1rem; margin-bottom: .9rem;
}
.panel h2 { margin: 0 0 .3rem; font-size: .78rem; text-transform: uppercase;
             letter-spacing: .07em; color: var(--dim); font-weight: 600; }
.row { display: flex; gap: .9rem; flex-wrap: wrap; }
.grow { flex: 1 1 16rem; }
.dim { color: var(--dim); font-size: .87rem; }
.big { font-family: var(--mono); font-size: 1.15rem; word-break: break-all;
       line-height: 1.35; }

/* ---------------------------------------------------------------- library */

#left { position: sticky; top: .6rem; background: var(--panel);
        border: 1px solid var(--line); border-radius: 9px; padding: .85rem; }
#libsearch, #pattern, .ctl input, #savename, #savenote {
  width: 100%; background: var(--bg); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: .4rem .55rem;
  font: inherit;
}
#pattern { font-family: var(--mono); font-size: 1.02rem; }
.patrow { display: flex; gap: .4rem; align-items: stretch; }
.patrow #pattern { flex: 1 1 auto; width: auto; min-width: 0; }
#codetoggle { flex: 0 0 auto; background: var(--bg); color: var(--dim);
              border: 1px solid var(--line); border-radius: 6px;
              padding: 0 .6rem; font-family: var(--mono); font-size: .92rem;
              cursor: pointer; }
#codetoggle:hover, #codetoggle.open { border-color: var(--accent);
              color: var(--accent); }
/* A folded-away code section still says it holds something. */
#codetoggle.filled { background: var(--accent-bg); color: var(--accent);
              border-color: var(--accent); font-weight: bold; }
#codewrap { margin-top: .5rem; }
#code { width: 100%; background: var(--bg); color: var(--fg);
        border: 1px solid var(--line); border-radius: 6px; padding: .5rem .55rem;
        font-family: var(--mono); font-size: .86rem; resize: vertical;
        margin-top: .3rem; }
#tabs { display: flex; gap: .4rem; padding: 0 1.4rem;
        border-bottom: 1px solid var(--line); }
#tabs .tab { background: none; border: 0; border-bottom: 2px solid transparent;
        margin-bottom: -1px; padding: .55rem .9rem; color: var(--dim);
        font: inherit; font-size: .85rem; font-weight: 600;
        text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }
#tabs .tab.on { color: var(--accent); border-bottom-color: var(--accent); }

#helperlist { margin: 0; }
#helperlist dt { margin-top: .6rem; }
#helperlist dt code { font-family: var(--mono); font-size: .82rem;
                      color: var(--accent); }
#helperlist dd { margin: .1rem 0 0; font-size: .85rem; color: var(--dim); }

#dictlist { list-style: none; margin: 0 0 .6rem; padding: 0;
            max-height: 30rem; overflow-y: auto; }
#dictlist li { border: 1px solid var(--line); border-radius: 7px;
               padding: .5rem .6rem; margin-bottom: .5rem; }
.dhead { display: flex; align-items: center; gap: .4rem; }
.dhead code { font-family: var(--mono); font-size: .82rem; color: var(--accent); }
.dhead .tag { font-size: .68rem; text-transform: uppercase; letter-spacing: .05em;
              color: var(--dim); border: 1px solid var(--line);
              border-radius: 999px; padding: 0 .4rem; }
.dhead .del { margin-left: auto; background: none; border: 0; color: var(--dim);
              cursor: pointer; font-size: 1.1rem; }
.dhead .del:hover { color: var(--err); }
.dname { font-size: .9rem; margin: .15rem 0; cursor: help; }
.dmeta { font-size: .78rem; color: var(--dim); }
.duse { margin-top: .35rem; background: var(--accent-bg); color: var(--accent);
        border: 1px solid var(--line); border-radius: 6px; padding: .2rem .6rem;
        font: inherit; font-size: .8rem; cursor: pointer; }

.panetitle { margin: 0 0 .4rem; font-size: .9rem; font-weight: 600;
             letter-spacing: .01em; }
#onboard { margin: 0 0 .55rem; font-size: .82rem; line-height: 1.4; }
#onboard a { color: var(--accent); text-decoration: none; cursor: pointer; }
#onboard a:hover { text-decoration: underline; }
#onboard .sep { color: var(--dim); margin: 0 .25rem; }
/* Category filters: one icon each, wrapping if the pane is narrow. */
#libtabs { display: flex; flex-wrap: wrap; gap: .25rem; margin: .5rem 0; }
.subtab { flex: 1 1 0; min-width: 2rem; display: flex; align-items: center;
          justify-content: center; background: none;
          border: 1px solid var(--line); border-radius: 6px; padding: .28rem;
          color: var(--dim); cursor: pointer; }
.subtab svg { width: 18px; height: 18px; display: block; }
.subtab:hover { color: var(--accent); border-color: var(--accent); }
.subtab.on { background: var(--accent-bg); color: var(--accent);
             border-color: var(--accent); }
#liblist { list-style: none; margin: 0; padding: 0;
           max-height: 26rem; overflow-y: auto; overflow-x: hidden; }
#liblist li { display: flex; align-items: stretch; gap: .2rem;
              border-radius: 6px; min-width: 0; }
#liblist .pick { min-width: 0; }
#liblist li.on { background: var(--accent-bg); }
#liblist li.famhead { padding: .4rem .3rem .1rem; font-size: .78rem;
                      font-weight: 600; color: var(--dim);
                      text-transform: uppercase; letter-spacing: .05em; }
#liblist li.child { margin-left: .7rem;
                    border-left: 2px solid var(--line); }
#liblist .pick { flex: 1; text-align: left; background: none; border: 0;
                 color: inherit; padding: .32rem .4rem; cursor: pointer;
                 border-radius: 6px; font: inherit; }
#liblist .pick:hover { background: var(--accent-bg); }
#liblist .nmrow { display: flex; align-items: center; gap: .35rem; min-width: 0; }
#liblist .nm { font-size: .9rem; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
.badges { display: inline-flex; gap: .25rem; flex: 0 0 auto; }
.badge { font-family: var(--mono); font-size: .66rem; line-height: 1;
         color: var(--dim); border: 1px solid var(--line); border-radius: 4px;
         padding: .1rem .25rem; cursor: help; }
#liblist code { display: block; font-family: var(--mono); font-size: .76rem;
                color: var(--dim); overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
#liblist .del, #liblist .edt { background: none; border: 0; color: var(--dim);
                cursor: pointer; font-size: 1rem; padding: 0 .3rem; }
#liblist .del:hover { color: var(--err); }
#liblist .edt:hover { color: var(--accent); }
.wide { width: 100%; margin-top: .6rem; padding: .4rem;
        background: var(--accent-bg); color: var(--accent);
        border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
        font: inherit; }

/* -------------------------------------------------------------- workbench */

#tooltip { position: absolute; z-index: 50; max-width: 32rem;
           background: var(--fg); color: var(--bg); font-size: .85rem;
           line-height: 1.45; padding: .5rem .7rem; border-radius: 7px;
           box-shadow: 0 4px 16px rgba(0,0,0,.28); pointer-events: none; }
.tip-host { cursor: help; }
/* The order rides in the Elements header as a natural-case parenthetical, not
   swept up into the header's small-caps treatment. */
.ehead { display: flex; align-items: baseline; gap: .45rem; flex-wrap: wrap; }
#orderlabel { text-transform: none; letter-spacing: 0; font-weight: 400; }
#orderlabel.tip-host { border-bottom: 1px dotted var(--dim); }
.err { color: var(--err); font-size: .9rem; margin-top: .4rem;
       font-family: var(--mono); }

.flags { display: flex; flex-wrap: wrap; gap: .1rem 1.2rem;
         margin-top: .6rem; align-items: baseline; }
.flabel { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em;
          color: var(--dim); font-weight: 600; }
.flags label { display: flex; align-items: baseline; gap: .35rem;
               font-size: .9rem; cursor: pointer; }
.flags em { color: var(--dim); font-size: .78rem; font-style: normal;
            font-family: var(--mono); }

/* A wide column gap so each control reads as its own group; the checkbox and
   its label, tight together below, then clearly bind to each other rather than
   to the neighbouring field. */
.controls { display: flex; flex-wrap: wrap; gap: .55rem 1.3rem; align-items: end; }
.ctl { display: flex; flex-direction: column; gap: .18rem; font-size: .82rem;
       color: var(--dim); }
.ctl input { min-width: 7rem; }
/* The checkbox and its label belong on one line, snug against each other. */
.ctl.chk { flex-direction: row; align-items: center; gap: .3rem;
           white-space: nowrap; padding-bottom: .42rem; }
/* Not a text field: the checkbox must not inherit the 7rem min-width, which
   was stranding its label a column away. */
.ctl.chk input { min-width: 0; width: auto; margin: 0; }
.ctl.grow { flex: 1 1 12rem; }
.ctl em { font-family: var(--mono); font-style: normal; }

.nav { display: flex; gap: .4rem; flex-wrap: wrap; margin: .7rem 0 .5rem; }
.nav button { background: var(--bg); color: var(--fg);
              border: 1px solid var(--line); border-radius: 6px;
              padding: .32rem .75rem; cursor: pointer; font: inherit;
              font-size: .88rem; }
.nav button:hover:not(:disabled) { border-color: var(--accent);
                                   color: var(--accent); }
.nav button:disabled { opacity: .4; cursor: default; }

#bookmarks { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0 0 .6rem;
             align-items: center; }
#bookmarks:empty { margin: 0; }
.mark { display: inline-flex; align-items: center;
        border: 1px solid var(--accent); border-radius: 999px;
        overflow: hidden; }
.mark .markgo { background: var(--accent-bg); color: var(--accent); border: 0;
                padding: .18rem .6rem; font: inherit; font-size: .82rem;
                cursor: pointer; }
.mark .markdel { background: var(--accent-bg); color: var(--accent); border: 0;
                 border-left: 1px solid var(--accent); padding: .18rem .4rem;
                 cursor: pointer; }
.mark .markdel:hover { color: var(--err); }
#markadd { background: none; border: 1px dashed var(--line); border-radius: 999px;
           color: var(--dim); padding: .18rem .55rem; font-size: .82rem;
           cursor: pointer; }
#markadd:hover { border-color: var(--accent); color: var(--accent); }
#coarse { margin: .2rem 0 .7rem; }
#slider { width: 100%; margin: 0; }
#sliderhint { margin-top: .15rem; }

#results { width: 100%; border-collapse: collapse; font-family: var(--mono);
           font-size: .92rem; }
#results th { text-align: left; font-weight: 500; font-size: .72rem;
              text-transform: uppercase; letter-spacing: .06em;
              color: var(--dim); border-bottom: 1px solid var(--line);
              padding: .2rem .5rem; font-family: system-ui, sans-serif; }
#results td { padding: .12rem .5rem; border-bottom: 1px solid var(--line); }
#results .ix { text-align: right; color: var(--dim); white-space: nowrap;
               width: 1%; }
#results .val { word-break: break-all; }
#results .out { word-break: break-all; color: var(--accent);
                font-family: var(--mono); }
#results .err-cell { color: var(--err); text-align: center; cursor: help;
                     font-weight: bold; }
.ctrl { color: var(--err); font-size: .8em; opacity: .8; }
.sp { background: var(--line); border-radius: 2px; }

a { color: var(--accent); }

details summary { cursor: pointer; font-size: .78rem; text-transform: uppercase;
                  letter-spacing: .07em; color: var(--dim); font-weight: 600; }

/* -------------------------------------------------------------- save form */

dialog { border: 1px solid var(--line); border-radius: 10px;
         background: var(--panel); color: var(--fg); max-width: 30rem;
         width: 90%; padding: 1.2rem; }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog label { display: block; margin-bottom: .7rem; font-size: .85rem;
               color: var(--dim); }
dialog menu { display: flex; justify-content: flex-end; gap: .5rem;
              margin: .8rem 0 0; padding: 0; }
dialog menu button { background: var(--bg); color: var(--fg);
                     border: 1px solid var(--line); border-radius: 6px;
                     padding: .35rem .9rem; cursor: pointer; font: inherit; }
#savego { background: var(--accent-bg); color: var(--accent);
          border-color: var(--accent); }

</style>
</head>
<body>

<header>
  <h1 data-t="title">rxenum</h1>
  <span class="sep">::</span>
  <span class="sub" data-t="subtitle"></span>
  <span class="repo">(<a id="repo" href="https://github.com/marcocarnut/jsrxe"
     target="_blank" rel="noopener" data-t="repoTag"></a>)</span>
  <select id="lang" aria-label="Language"></select>
</header>

<!-- global navigation: the left pane's content follows the active tab -->
<nav id="tabs">
  <button class="tab on" data-side="examples" data-t="workbench"></button>
  <button class="tab" data-side="helpers" data-t="helpers"></button>
  <button class="tab" data-side="dicts" data-t="dictionaries"></button>
</nav>

<main>

  <aside id="left">

    <!-- the regex example library -->
    <div id="examples-view">
      <h2 class="panetitle" data-t="libraryTitle"></h2>
      <!-- a quiet on-ramp: newcomers to the tutorial, veterans to the best -->
      <p id="onboard">
        <a href="#" id="ob-new" data-t="obNew"></a>
        <span class="sep">·</span>
        <a href="#" id="ob-best" data-t="obBest"></a>
      </p>
      <input id="libsearch" type="search" data-tplace="libSearch">
      <!-- category filters, one icon each; the tooltip names the category -->
      <div id="libtabs">
        <button class="subtab on" data-filter="all" data-ttip="filterAll" aria-label="all">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1"/><rect x="13" y="13" width="7.5" height="7.5" rx="1"/></svg>
        </button>
        <button class="subtab" data-filter="tutorial" data-ttip="filterTutorial" aria-label="tutorial">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 23 8.2 12 13.4 1 8.2Z"/><path d="M5 10.6v4c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M23 8.2v6.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="subtab" data-filter="highlights" data-ttip="filterHighlights" aria-label="highlights">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.7-4.9 4.5 1.3 6.5-5.9-3.3-5.9 3.3 1.3-6.5L2.5 9.2l6.6-.7z"/></svg>
        </button>
        <button class="subtab" data-filter="code" data-ttip="filterCode" aria-label="has code">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/><path d="M13.5 5l-3 14"/></svg>
        </button>
        <button class="subtab" data-filter="finite" data-ttip="filterFinite" aria-label="finite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9.5 4 7.5 20"/><path d="M16.5 4 14.5 20"/><path d="M4.5 9.5H20"/><path d="M4 14.5H19.5"/></svg>
        </button>
        <button class="subtab" data-filter="infinite" data-ttip="filterInfinite" aria-label="infinite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8.3" cy="12" r="3.6"/><circle cx="15.7" cy="12" r="3.6"/></svg>
        </button>
        <button class="subtab" data-filter="mine" data-ttip="filterMine" aria-label="mine">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>
        </button>
      </div>
      <ul id="liblist"></ul>
      <button id="addown" class="wide" data-t="addOwn"></button>
    </div>

    <!-- the helper-function reference for the code section -->
    <div id="helpers-view" hidden>
      <p class="dim" data-t="helpersHint"></p>
      <dl id="helperlist"></dl>
    </div>

    <!-- the word dictionaries, built-in and the user's own -->
    <div id="dicts-view" hidden>
      <p class="dim" data-t="dictsHint"></p>
      <ul id="dictlist"></ul>
      <button id="adddict" class="wide" data-t="addDict"></button>
    </div>

  </aside>

  <!-- the workbench, always present -->
  <section id="work">

    <div class="panel">
      <label for="pattern" data-t="patternLabel"></label>
      <div class="patrow">
        <input id="pattern" type="text" spellcheck="false" autocapitalize="off"
               autocomplete="off" data-tplace="patternPlace">
        <button id="codetoggle" type="button" title="">&lt;/&gt;</button>
      </div>
      <div id="err" class="err" hidden></div>
      <!-- the per-element code, folded in behind the </> button to save a line -->
      <div id="codewrap" hidden>
        <p class="dim" data-t="codeHint"></p>
        <textarea id="code" rows="3" spellcheck="false" autocapitalize="off"
                  autocomplete="off"></textarea>
        <div id="codeerr" class="err" hidden></div>
      </div>
    </div>

    <div class="panel">
      <h2 data-t="size"></h2>
      <div id="count" class="big tip-host"></div>
      <div id="approx" class="dim"></div>
    </div>

    <div class="panel">
      <!-- the enumeration order rides in the header, with its own tooltip -->
      <h2 class="ehead"><span data-t="elements"></span>
          <span id="orderlabel" class="tip-host"></span></h2>

      <div class="controls">
        <label class="ctl"><span data-t="fromIndex"></span>
          <input id="from" type="text" inputmode="numeric" value="0"></label>
        <label class="ctl"><span data-t="perPage"></span>
          <input id="per" type="number" min="1" max="1000" value="50"></label>
        <label class="ctl chk"><input type="checkbox" id="zero" checked>
          <span data-t="zeroBased"></span></label>
        <label class="ctl grow"><span data-t="key"></span>
          <input id="key" type="text" data-tplace="keyPlace"></label>
      </div>

      <div class="nav">
        <button id="first" data-t="first"></button>
        <button id="prev" data-t="prev"></button>
        <button id="next" data-t="next"></button>
        <button id="last" data-t="last"></button>
        <button id="random" data-t="random"></button>
      </div>

      <div id="bookmarks"></div>

      <div id="coarse">
        <input id="slider" class="tip-host" type="range" min="0" max="10000" value="0">
      </div>

      <table id="results">
        <thead><tr><th class="ix" data-t="indexCol"></th>
                   <th data-t="valueCol"></th>
                   <th id="outcol" data-t="outputCol" hidden></th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="status" class="dim"></div>
    </div>

    <details class="panel">
      <summary data-t="aboutTitle"></summary>
      <p class="dim" data-t="about"></p>
      <p class="dim">
        <a href="https://github.com/marcocarnut/rxe" target="_blank"
           rel="noopener">github.com/marcocarnut/rxe</a> &mdash;
        <span data-t="repoLib"></span><br>
        <a href="https://github.com/marcocarnut/jsrxe" target="_blank"
           rel="noopener">github.com/marcocarnut/jsrxe</a> &mdash;
        <span data-t="repoApp"></span>
      </p>
    </details>

  </section>
</main>

<!-- floating tooltip, positioned in JavaScript over whatever carries a note -->
<div id="tooltip" hidden></div>

<!-- --------------------------------------------------- save-an-example form -->
<dialog id="savebox">
  <form method="dialog">
    <label><span data-t="addName"></span>
      <input id="savename" type="text" required></label>
    <label><span data-t="addNote"></span>
      <textarea id="savenote" rows="4"></textarea></label>
    <p class="dim" data-t="savedHere"></p>
    <menu>
      <button value="cancel" data-t="addCancel"></button>
      <button id="savego" value="save" data-t="addSave"></button>
    </menu>
  </form>
</dialog>

<!-- ------------------------------------------------------ add-a-dictionary form -->
<dialog id="dictbox">
  <form method="dialog">
    <label><span data-t="dictName"></span>
      <input id="dictname" type="text" required pattern="[A-Za-z0-9_]+"></label>
    <p class="dim" data-t="dictNameHint"></p>
    <label><span data-t="dictWords"></span>
      <textarea id="dictwords" rows="8" spellcheck="false"></textarea></label>
    <p><input id="dictfile" type="file" accept=".txt,.dict,text/plain"></p>
    <p class="dim" data-t="savedHere"></p>
    <menu>
      <button value="cancel" data-t="addCancel"></button>
      <button value="save" data-t="addSave"></button>
    </menu>
  </form>
</dialog>

<!-- ------------------------------------------------------ add-a-bookmark form -->
<dialog id="bmbox">

const rr = (x, n) => (x >>> n) | (x << (32 - n));

function sha256(str) {
  const bytes = new Uint8Array(str.length);

  // are written: nothing here hashes half a gigabyte.

    0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,

  for (let off = 0; off < withPad.length; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = view.getUint32(off + i * 4, false);

// Compiling an example's code into a function.
//
// The code is the user's own, but examples are meant to be shared -- exported,
// pasted, in time perhaps fetched -- so it is treated as if it came from
// somewhere untrusted. It is not a security boundary in the strong sense; a
// determined script can still reach the globals a worker exposes. What this
// does is make the accidental case safe and the interface small: the code is a
// function body with two parameters and a helper object, compiled in strict
// mode, with no lexical access to anything around it.
//
// The helper object is the whole standard library the code gets. Everything in
// it is pure and self-contained, so an example is reproducible and does not
// depend on what the host happens to have: the SHA-256 here is the one in
// sha256.js, not the browser's.

// mod 11 with the classic Brazilian weighting, shared by CPF and CNPJ. Each
// character counts as its code point minus 48, which is why the alphanumeric
// CNPJ works unchanged: a digit's value is itself, and a letter continues
// upward from A = 17.
function mod11(chars, weights) {
  let sum = 0;
  for (let i = 0; i < chars.length; i++)
    sum += (chars.charCodeAt(i) - 48) * weights[i];
  const r = 11 - (sum % 11);
  return r > 9 ? 0 : r;
}

const HELPERS = {
  sha256,
  mod11,

  // The two Brazilian check digits, given the base and the two weight rows.
  // Returned as a two-character string, most significant first.
  checkDigits(base, w1, w2) {
    const d1 = mod11(base, w1);
    const d2 = mod11(base + d1, w2);
    return "" + d1 + d2;
  },

  // Keep only the characters matching a class, e.g. digitsOf("12.345") ==
  // "12345". Handy for stripping a formatted number back to its payload.
  keep(s, re) { return s.replace(new RegExp("[^" + re + "]", "g"), ""); },

  toHex(s) {
    let out = "";
    for (let i = 0; i < s.length; i++)
      out += s.charCodeAt(i).toString(16).padStart(2, "0");
    return out;
  }
};

// which the caller reports; a run-time throw is left to the caller's per-row
// handling, since it may be true of some elements and not others.
function makeTransform(source) {
  // Strict mode, three named parameters, and nothing else in scope: the
  // Function constructor closes over the global scope, not over this module,
  // so the code cannot see sha256 or anything else here except through 'lib'.
  const fn = new Function("value", "index", "lib",

// The decimal mark, so exponents and mantissas read naturally in each language.
const DECSEP = { en: ".", pt: "," };

function makeT(lang) {
  const table = STRINGS[lang] || STRINGS.en;
  return (key) => (key in table ? table[key] : STRINGS.en[key] || key);
}

function translateError(msg, lang) {
  if (lang === "pt" && ERRORS.pt[msg]) return ERRORS.pt[msg];
  return msg;
}

// Everything the interface asks of the library, with nothing around it.
//
// This knows about neither the worker nor the page, which is what lets the
// same code be driven from a browser and from node. The browser-side test
// checks the plumbing; tests/node.mjs checks the answers, headlessly, against
// values the command-line tool prints.
//
// Indices are decimal strings throughout. They routinely exceed what a double
// holds exactly -- '[0-9a-f]{8}-...' has 2^122 members -- and a decimal string
// round-trips through BigInt losslessly, which a number does not.

const RXE_CASELESS      = 0x0001;
const RXE_DOTALL        = 0x0002;
const RXE_LEFT_TO_RIGHT = 0x0004;

// 'randomBytes' is the one thing here that cannot be pure, so it is passed in
// rather than reached for: browsers have had globalThis.crypto for years, node
// only since 19, and a caller may reasonably want a seeded source instead.
//
// 'makeTransform' turns an example's code into a function applied to each
// generated element. It is injected the same way, so that engine.js has no
// opinion on how the code is compiled and the tests can hand it a plain
// function instead of a string.

function makeEngine(Module, {
  randomBytes = (n) => {
    const buf = new Uint8Array(n);
    globalThis.crypto.getRandomValues(buf);
    return buf;
  },
  makeTransform = null

  const c = (name, ret, args) => Module.cwrap(name, ret, args);
  const api = {
    parse:        c("rxe_js_parse",               "number", ["string","number"]),
    release:      c("rxe_js_release",             null,     ["number"]),
    free:         c("rxe_js_free",                null,     ["number"]),
    error:        c("rxe_js_error",               "number", ["number"]),
    errorMessage: c("rxe_js_error_message",       "number", ["number"]),
    isInfinite:   c("rxe_js_is_infinite",         "number", ["number"]),
    isShortlex:   c("rxe_js_is_shortlex",         "number", ["number"]),
    count:        c("rxe_js_count",               "number", ["number"]),
    countAt:      c("rxe_js_count_at_length",     "number", ["number","number"]),
    seek:         c("rxe_js_seek",                "number", ["number","string"]),
    current:      c("rxe_js_current",             "number", ["number","number"]),
    permNew:      c("rxe_js_permutation_new",     "number", ["string","string"]),
    permRelease:  c("rxe_js_permutation_release", null,     ["number"]),
    permMap:      c("rxe_js_permutation_map",     "number", ["number","string"]),
    registerDict: c("rxe_js_register_dict",       null,     ["string","string"]),
    freeDicts:    c("rxe_js_free_dicts",           null,     [])
  };

  let rxe = 0;        // the parsed expression
  let perm = 0;       // the keyed permutation, when one is set
  let permCount = null; // its domain, so a keyed page never runs past the set
  let transform = null; // the example's code, applied to each element

  // Take ownership of a char* the library allocated.
  const takeString = (ptr) => {
    if (!ptr) return null;
    const s = Module.UTF8ToString(ptr);
    api.free(ptr);
    return s;
  };

  // The selected element. Members may hold any byte value, including ones
  // that are not valid UTF-8 and zero itself, so this reads by the reported
  // length rather than to a terminator and maps bytes one to one onto code
  // points -- the page can then show a control character as such instead of
  // losing it.
  const currentElement = () => {
    const lenPtr = Module._malloc(4);
    const ptr = api.current(rxe, lenPtr);
    if (!ptr) { Module._free(lenPtr); return ""; }
    const len = Module.HEAP32[lenPtr >> 2];
    let out = "";
    for (let i = 0; i < len; i++) out += String.fromCharCode(Module.HEAPU8[ptr + i]);
    api.free(ptr);
    Module._free(lenPtr);
    return out;
  };

  const clearPerm = () => { if (perm) { api.permRelease(perm); perm = 0; } permCount = null; };
  const clearRxe = () => { clearPerm(); if (rxe) { api.release(rxe); rxe = 0; } };

  // Where an index actually lands. With a shuffle key the two differ: the key
  // permutes the index before the seek, which is what walks the whole set in
  // a scattered but reproducible order.
  const targetFor = (index) =>
    perm ? (takeString(api.permMap(perm, index)) || index) : index;

  // A row, with the transform's output attached when there is one. The
  // transform runs in its own try: an example's code is under the user's
  // control and may throw, and one bad row should not blank the page.
  const withTransform = (index, value) => {
    const row = { index, value };
    if (transform) {
      try { row.output = String(transform(value, index)); }
      catch (e) { row.output = ""; row.error = String(e && e.message ? e.message : e); }
    }
    return row;
  };

  return {

    parse({ pattern, flags }) {
      clearRxe();
      let f = 0;
      if (flags.includes("i")) f |= RXE_CASELESS;
      if (flags.includes("s")) f |= RXE_DOTALL;
      if (flags.includes("L")) f |= RXE_LEFT_TO_RIGHT;
      rxe = api.parse(pattern, f);
      if (!rxe) return { ok: false, error: "out of memory" };
      if (api.error(rxe)) {
        const error = takeString(api.errorMessage(rxe));
        clearRxe();
        return { ok: false, error };
      }
      const infinite = !!api.isInfinite(rxe);
      return {
        ok: true,
        infinite,
        shortlex: !!api.isShortlex(rxe),
        count: infinite ? null : takeString(api.count(rxe))
      };
    },

    // Compile and install an example's code, or clear it. Returns whether it
    // compiled; a transform that throws only at run time fails per row, which
    // is the row's business rather than this call's.
    code({ source }) {
      transform = null;
      if (!source || !makeTransform) return { ok: true, active: false };
      try { transform = makeTransform(source); return { ok: true, active: true }; }
      catch (e) { return { ok: false, error: String(e && e.message ? e.message : e) }; }
    },

    // Set or clear the shuffle key. A permutation is over [0, count), so it
    // needs a finite set to be a permutation of.
    key({ key, count }) {
      clearPerm();
      if (!key || !count || count === "0") return { ok: true, active: false };
      perm = api.permNew(count, key);
      if (perm) permCount = BigInt(count);
      return { ok: true, active: !!perm };
    },

    // A window of the enumeration. Each row is sought independently, which is
    // why a page anywhere in the set costs the same as the first one. When an
    // example carries code, each element is passed through it and the result
    // shown alongside -- a check digit appended, a hash compared, and so on.
    rows({ from, n }) {
      if (!rxe) return { rows: [] };
      const rows = [];
      let index = BigInt(from);
      for (let i = 0; i < n; i++) {
        if (index < 0n) break;
        // With a key the walk is a permutation of [0, count); there is nothing
        // beyond it, and asking the map for an out-of-range index is exactly
        // what used to spin.
        if (perm && permCount !== null && index >= permCount) break;
        if (api.seek(rxe, targetFor(index.toString()))) break;
        rows.push(withTransform(index.toString(), currentElement()));
        index += 1n;
      }
      return { rows };
    },

    // Uniformly chosen members. The range is the library's idea of the set's
    // size rather than a rounded double, and the surplus bytes put the modulo
    // bias far below anything that could show.
    random({ count, n }) {
      if (!rxe || !count || count === "0") return { rows: [] };
      const total = BigInt(count);
      const bytes = Math.ceil(total.toString(2).length / 8) + 8;
      const rows = [];
      for (let i = 0; i < n; i++) {
        const buf = randomBytes(bytes);
        let v = 0n;
        for (const b of buf) v = (v << 8n) | BigInt(b);
        const index = v % total;
        if (api.seek(rxe, index.toString())) continue;
        rows.push(withTransform(index.toString(), currentElement()));
      }
      return { rows };
    },

    // How many members have each length. Meaningful for every expression, and
    // the only size an infinite one has to report.
    lengths({ max }) {
      if (!rxe) return { counts: [] };
      const counts = [];
      for (let L = 0; L <= max; L++) counts.push(takeString(api.countAt(rxe, L)));
      return { counts };
    },

    // Make [:name:] draw from these words. The words cross the boundary as one
    // newline-joined string, which the binding splits.
    registerDict({ name, words }) {
      api.registerDict(name, words.join("\n"));
      return { ok: true };
    },

    // Forget every registered dictionary, so the caller can re-register the
    // set that remains after one is removed.
    freeDicts() { api.freeDicts(); return { ok: true }; },

    // The index of the first member of each length, which is the running sum
    // of the counts before it. An infinite set has no proportion to slide
    // along, but it does have this: jumping to a length is the coarse
    // movement that a scrollbar would otherwise provide, and it is the
    // structure the enumeration actually has rather than an arbitrary
    // exponential scale laid over it.
    lengthStarts({ max }) {
      if (!rxe) return { starts: [] };
      const starts = [];
      let running = 0n;
      for (let L = 0; L <= max; L++) {
        starts.push(running.toString());
        const c = takeString(api.countAt(rxe, L));
        running += BigInt(c || "0");
        // Past this there is nothing useful to offer: the index would be too
        // long to type, let alone reach by scrolling.
        if (running > 10n ** 40n) break;
      }
      return { starts };
    },

    // Whether each of several expressions is infinite. The page uses this to
    // sort its examples rather than guessing from the text of the pattern,
    // which got '\\+55 \\d{2} 9\\d{4}-\\d{4}' wrong: the escaped plus in a
    // Brazilian mobile number looks exactly like a quantifier.
    classify({ patterns }) {
      const out = [];
      for (const p of patterns) {
        clearRxe();
        rxe = api.parse(p.pattern, 0);
        out.push({
          id: p.id,
          ok: !!rxe && !api.error(rxe),
          infinite: !!rxe && !api.error(rxe) && !!api.isInfinite(rxe)
        });
      }
      clearRxe();
      return { classified: out };
    }
  };
}

// Thousands separators on an arbitrarily long decimal string. Intl cannot be
// used here: these numbers routinely have thousands of digits, far past what
// a Number holds, and the whole point is to show them exactly.
function group(s) {
  const sep = lang === "pt" ? "." : ",";
  let out = "", n = 0;
  for (let i = s.length - 1; i >= 0; i--) {
    out = s[i] + out;
    if (++n % 3 === 0 && i > 0) out = sep + out;
  }
  return out;
}

// log10 and log2 of a decimal string, without turning it into a Number.
function logs(s) {
  const digits = s.length;
  const lead = Number(s.slice(0, 17)) || 1;
  const log10 = Math.log10(lead) + (digits - Math.min(17, digits));
  return { log10, log2: log10 / Math.log10(2) };
}

// A fixed-point number with the language's decimal mark, for exponents and
// mantissas -- Portuguese writes 10^2,4771, not 10^2.4771.
function dec(x, digits) {
  const s = x.toFixed(digits);
  return DECSEP[lang] === "," ? s.replace(".", ",") : s;
}

// Read a set's size the way a person would say it: "about 30 quinvigintillion".
// Works straight off the exact decimal string -- the number of digits gives the
// magnitude, the leading digits give the mantissa -- so it stays honest for
// sizes far past what a double could hold. Beyond the naming table it falls
// back to a digit count.
function spoken(s) {
  const d = s.length;
  const g = Math.floor((d - 1) / 3);        // how many three-digit groups
  if (g < 1) return "";                     // under a thousand; it speaks for itself
  const table = SCALES[lang] || SCALES.en;
  if (g >= table.length)
    return `${t("spokenDigitsPre")} ${group(String(d))} ${t("spokenDigitsPost")}`;

  const intLen = d - 3 * g;                  // 1..3 digits before the scale
  const head = s.slice(0, Math.min(d, intLen + 4));
  const mant = Number(head) / Math.pow(10, head.length - intLen);

  // Round the mantissa to something a person would actually say.
  const nice = mant >= 100 ? Math.round(mant / 10) * 10
             : mant >= 10  ? Math.round(mant)
             :               Math.round(mant * 10) / 10;

  // The exact integer we are about to say aloud, so we can tell whether the
  // real count lands on it, just under, or just over -- the spoken echo of the
  // "=" versus "~" on the numeric exponents. nice*10 is always whole (nice has
  // at most one decimal), so the scale keeps this exact for any size.
  const spokenValue = BigInt(Math.round(nice * 10)) * (10n ** BigInt(3 * g - 1));
  const actual = BigInt(s);
  const lead = actual === spokenValue ? t("spokenExactly")
             : actual <  spokenValue  ? t("spokenBitLess")
             :                          t("spokenBitMore");

  let word = table[g];
  // Portuguese pluralises the -ão scale words; "mil" and English do not.
  if (lang === "pt" && nice !== 1 && word.endsWith("ão"))
    word = word.slice(0, -2) + "ões";

  const mantStr = Number.isInteger(nice) ? String(nice) : dec(nice, 1);
  return `${lead} ${mantStr} ${word}`;
}

function isExactPower(s, base) {
  let v;
  try { v = BigInt(s); } catch { return false; }
  if (v <= 0n) return false;
  const b = BigInt(base);
  while (v % b === 0n) v /= b;
  return v === 1n;
}

// One floating tooltip, positioned over whichever element the pointer is on.
// The text comes from a getter so it tracks the current example and language
// rather than being fixed when the handler was attached; an empty string
// means there is nothing to say and nothing is shown.
function attachTip(el, getter) {
  const tip = $("tooltip");
  const place = () => {
    const text = getter();
    if (!text) { tip.hidden = true; return; }
    tip.textContent = text;
    tip.hidden = false;
    const r = el.getBoundingClientRect();
    const top = r.bottom + window.scrollY + 6;
    tip.style.top = top + "px";
    // Keep it on screen: clamp the left edge to the viewport.
    const w = Math.min(tip.offsetWidth, window.innerWidth - 16);
    let left = r.left + window.scrollX;
    if (left + w > window.scrollX + window.innerWidth - 8)
      left = window.scrollX + window.innerWidth - 8 - w;
    tip.style.left = Math.max(8, left) + "px";
  };
  el.addEventListener("mouseenter", place);
  el.addEventListener("mouseleave", () => { tip.hidden = true; });
}

// Members can hold any byte, including control characters. Render those
// visibly rather than letting them disappear into the markup.
function renderValue(s) {
  if (s === "") return `<span class="dim">${t("emptyString")}</span>`;
  let out = "";
  for (const ch of s) {
    const c = ch.charCodeAt(0);
    if (c < 32 || c === 127) out += `<span class="ctrl">\\x${c.toString(16).padStart(2, "0")}</span>`;
    else if (ch === "&") out += "&amp;";
    else if (ch === "<") out += "&lt;";
    else if (ch === ">") out += "&gt;";
    else if (ch === " ") out += `<span class="sp"> </span>`;
    else out += ch;
  }
  return out;
}

    el.placeholder = t(el.dataset.tplace);
  for (const el of document.querySelectorAll("[data-ttip]"))
    el.title = t(el.dataset.ttip);
  $("code").placeholder = t("codePlace");
  $("codetoggle").title = t("codeToggle");
  renderLibrary();
  renderHelpers();
  renderDicts();
  renderBookmarks();
  renderNote();
  renderCount();
  renderOrder();
  renderRows(lastRows);
}

/* --------------------------------------------------------- example library */

function allExamples() {
  return BUILTIN.concat(mine.map((m) => ({ ...m, own: true })));
}

function exampleName(ex) {
  return typeof ex.name === "string" ? ex.name : (ex.name[lang] || ex.name.en);
}

function exampleFamily(ex) {
  if (!ex.family) return null;
  return typeof ex.family === "string" ? ex.family : (ex.family[lang] || ex.family.en);
}

function exampleNote(ex) {
  if (!ex.note) return "";
  return typeof ex.note === "string" ? ex.note : (ex.note[lang] || ex.note.en);
}

// Which bucket an example goes in. The library is asked rather than the text
// inspected, because the text lies: '\\+55 \\d{2} 9\\d{4}-\\d{4}' is a Brazilian
// mobile number and perfectly finite, but the escaped plus in it looks exactly
// like a quantifier and had it filed under the infinite ones.
const classified = new Map();

function looksInfinite(ex) {
  if (classified.has(ex.id)) return classified.get(ex.id);
  if ("infinite" in ex) return ex.infinite;
  return false;
}

// Which examples a category filter shows. Single-select, so the categories can
// overlap freely -- a highlight may also be finite and carry code; each filter
// is just an independent view of the one library.
function matchesFilter(ex) {
  switch (state.filter) {
    case "tutorial":   return !!ex.tutorial;
    case "highlights": return !!ex.highlight;
    case "code":       return !!(ex.code && ex.code.trim());
    case "finite":     return !looksInfinite(ex);
    case "infinite":   return looksInfinite(ex);
    case "mine":       return !!ex.own;
    default:           return true;              // "all"
  }
}

// Make a category the active filter, moving the highlight to its icon.
function setFilter(f) {
  state.filter = f;
  for (const b of document.querySelectorAll("#libtabs .subtab"))
    b.classList.toggle("on", b.dataset.filter === f);
  renderLibrary();
}

async function classifyExamples() {
  const list = allExamples().filter((e) => !classified.has(e.id));
  if (!list.length) return;
  const r = await call("classify",
                       { patterns: list.map((e) => ({ id: e.id, pattern: e.pattern })) });
  for (const c of r.classified || []) classified.set(c.id, c.infinite);
  renderLibrary();
}

function renderLibrary() {
  const q = $("libsearch").value.trim().toLowerCase();
  const list = $("liblist");
  list.innerHTML = "";
  let lastFamily = null;
  for (const ex of allExamples()) {
    if (!matchesFilter(ex)) continue;
    const name = exampleName(ex);
    const family = exampleFamily(ex);
    if (q && !name.toLowerCase().includes(q) &&
        !(family || "").toLowerCase().includes(q) &&
        !ex.pattern.toLowerCase().includes(q)) continue;

    // A run of examples sharing a family gets one heading, and its members
    // are shown indented beneath it: two ways of the same thing -- every CPF
    // against the valid ones, say -- read as one entry with a choice.
    if (family && family !== lastFamily) {
      const head = document.createElement("li");
      head.className = "famhead";
      head.textContent = family;
      list.appendChild(head);
    }
    lastFamily = family;

    const li = document.createElement("li");
    li.className = (family ? "child " : "") + (state.selected === ex.id ? "on" : "");
    li.innerHTML =
      `<button class="pick"><span class="nmrow">` +
      `<span class="nm"></span><span class="badges"></span></span>` +
      `<code></code></button>` +
      (ex.own
        ? `<button class="edt" title="${t("editOne")}">&#9998;</button>` +
          `<button class="del" title="${t("deleteOne")}">&times;</button>`
        : "");
    li.querySelector(".nm").textContent = name;
    li.querySelector("code").textContent = ex.pattern;
    // Marks to the right of the name, so the list says what the title would
    // otherwise have to: infinite sets, and examples that carry code.
    const badges = li.querySelector(".badges");
    if (looksInfinite(ex))
      badges.insertAdjacentHTML("beforeend",
        `<span class="badge" title="${t("badgeInfinite")}">∞</span>`);
    if (ex.code && ex.code.trim())
      badges.insertAdjacentHTML("beforeend",
        `<span class="badge" title="${t("badgeCode")}">&lt;/&gt;</span>`);
    li.querySelector(".pick").onclick = () => selectExample(ex);
    if (ex.own) li.querySelector(".edt").onclick = () => openSaveBox(ex);
    if (ex.own) li.querySelector(".del").onclick = () => {
      if (!confirm(t("deleteConfirm"))) return;
      mine = mine.filter((m) => m.id !== ex.id);
      localStorage.setItem(STORE_MINE, JSON.stringify(mine));
      renderLibrary();
    };
    list.appendChild(li);
  }
}

/* -------------------------------------------------------- dictionaries */

function allDicts() {
  return BUILTIN_DICTS.map((d) => ({ ...d, builtin: true }))
    .concat(myDicts.map((d) => ({ ...d, builtin: false })));
}

function dictName(d) {
  if (!d.name) return d.id;
  return typeof d.name === "string" ? d.name : (d.name[lang] || d.name.en);
}

function dictNote(d) {
  if (!d.note) return "";
  return typeof d.note === "string" ? d.note : (d.note[lang] || d.note.en);
}

// Register every dictionary with the library, so [:name:] resolves. Called at
// startup and whenever the user's set changes; freeDicts first, so a removed
// one stops resolving. The words leave here as an array; the engine joins
// them for the boundary.
async function registerAllDicts() {
  await call("freeDicts");
  for (const d of allDicts())
    await call("registerDict", { name: d.id, words: d.words });
}

function renderDicts() {
  const list = $("dictlist");
  list.innerHTML = "";
  for (const d of allDicts()) {
    const li = document.createElement("li");
    const tag = d.builtin ? `<span class="tag">${t("dictBuiltin")}</span>` : "";
    li.innerHTML =
      `<div class="dhead"><code>[:${d.id}:]</code>${tag}` +
      (d.builtin ? "" : `<button class="del" title="${t("deleteOne")}">&times;</button>`) +
      `</div><div class="dname"></div>` +
      `<div class="dmeta">${d.words.length} ${t("dictWordsCount")}</div>` +
      `<button class="duse">${t("dictUse")}</button>`;
    li.querySelector(".dname").textContent = dictName(d);
    const note = dictNote(d);
    if (note) li.querySelector(".dname").title = note;
    li.querySelector(".duse").onclick = () => {
      // Drop [:id:] into the pattern at the cursor, or append it.
      const p = $("pattern");
      const ins = `[:${d.id}:]`;
      const at = p.selectionStart ?? p.value.length;
      p.value = p.value.slice(0, at) + ins + p.value.slice(p.selectionEnd ?? at);
      state.selected = null; renderNote(); renderLibrary(); scheduleReparse();
    };
    if (!d.builtin) li.querySelector(".del").onclick = async () => {
      if (!confirm(t("deleteConfirm"))) return;
      myDicts = myDicts.filter((m) => m.id !== d.id);
      localStorage.setItem(STORE_DICTS, JSON.stringify(myDicts));
      await registerAllDicts();
      renderDicts();
      reparse();
    };
    list.appendChild(li);
  }
}

// The helper reference, filled from the docs kept beside the helpers.
function renderHelpers() {
  const dl = $("helperlist");
  dl.innerHTML = HELPER_DOCS.map((h) =>
    `<dt><code>${escapeAttr(h.sig)}</code></dt>` +
    `<dd>${escapeAttr(h[lang] || h.en)}</dd>`).join("");
}

function selectExample(ex) {
  state.selected = ex.id;
  // Flags are expressed inline now, so an older example that still carries a
  // 'flags' field has it folded onto the front of the pattern as (?...).
  const inline = ex.flags ? "(?" + ex.flags + ")" : "";
  $("pattern").value = inline + ex.pattern;
  $("from").value = "0";
  $("key").value = "";
  $("code").value = ex.code || "";
  setCodeVisible(!!ex.code);
  refreshCodeToggle();
  state.from = 0n;
  renderLibrary();
  renderNote();
  reparse();
}

// The note is a tooltip over the regex field now, so this only records the
// text; attachTip reads it on hover.
function renderNote() {
  const ex = allExamples().find((e) => e.id === state.selected);
  state.note = ex ? exampleNote(ex) : "";
}

/* ---------------------------------------------------------------- parsing */

// Flags are written inline in the pattern, so there is nothing to gather from
// the interface; the empty string keeps the engine's flags argument happy.
function currentFlags() { return ""; }

let reparseTimer = null;
function scheduleReparse() {
  clearTimeout(reparseTimer);
  reparseTimer = setTimeout(reparse, 250);
}

let ready = false;

async function reparse() {
  if (!ready) return;
  const pattern = $("pattern").value;
  if (!pattern) { state.ok = false; renderAll(); return; }
  const r = await call("parse", { pattern, flags: currentFlags() });
  state.ok = r.ok;
  if (!r.ok) {
    $("err").textContent = t("parseError") + ": " + translateError(r.error, lang);
    show($("err"), true);
    state.count = null;
    renderAll();
    return;
  }
  show($("err"), false);
  state.infinite = r.infinite;
  state.shortlex = r.shortlex;
  state.count = r.count;
  await applyKey();
  await applyCode();
  renderAll();
  await loadLengthStarts();
  loadRows();
}

async function applyCode() {
  const source = $("code").value.trim();
  const r = await call("code", { source });
  state.codeActive = !!r.active;
  if (r.ok) { show($("codeerr"), false); }
  else { $("codeerr").textContent = r.error; show($("codeerr"), true); }
  show($("outcol"), state.codeActive);
}

async function applyKey() {
  const key = $("key").value.trim();
  if (key && state.infinite) {
    $("err").textContent = t("keyNeedsFinite");
    show($("err"), true);
    state.keyActive = false;
    await call("key", { key: "", count: null });
    return;
  }
  const r = await call("key", { key, count: state.count });
  state.keyActive = !!r.active;
}

/* ---------------------------------------------------------------- rendering */

function renderAll() {
  renderCount();
  renderOrder();
  const finite = state.ok && !state.infinite && state.count && state.count !== "0";
  $("last").disabled = !finite;
  $("random").disabled = !finite;
  // A finite set has a proportion to slide along. An infinite one does not,
  // but it does have lengths, and stepping by those is both the coarse
  // movement that is otherwise missing and a fair picture of how the set is
  // actually arranged -- far better than laying an arbitrary exponential
  // scale over an index with no end.
  if (finite) {
    state.slider = "proportion";
    $("slider").max = "10000";
    state.sliderTip = t("sliderHintFinite");
    show($("coarse"), true);
    syncSlider();
  } else if (state.ok && state.infinite) {
    state.slider = "length";
    $("slider").max = String(Math.max(1, lengthStarts.length - 1));
    $("slider").value = "0";
    state.sliderTip = t("sliderHintLength");
    show($("coarse"), lengthStarts.length > 1);
  } else {
    show($("coarse"), false);
  }
}

// The index at which each length begins, for the length slider. Empty until
// the expression is known to be infinite.
let lengthStarts = [];

async function loadLengthStarts() {
  lengthStarts = [];
  if (!state.ok || !state.infinite) return;
  const r = await call("lengthStarts", { max: 96 });
  lengthStarts = r.starts || [];
  renderAll();
}

function renderCount() {
  const el = $("count"), ap = $("approx");
  if (!state.ok) { el.textContent = ""; ap.textContent = ""; state.countSpoken = ""; return; }
  if (state.infinite) {
    el.textContent = t("sizeInfinite");
    ap.textContent = "";
    state.countSpoken = t("infiniteTip");
    return;
  }
  if (state.count === "0") {
    el.textContent = t("sizeEmpty"); ap.textContent = ""; state.countSpoken = ""; return;
  }
  el.textContent = group(state.count);
  const { log10, log2 } = logs(state.count);
  const p10 = isExactPower(state.count, 10) ? "=" : "~";
  const p2 = isExactPower(state.count, 2) ? "=" : "~";
  ap.textContent = `${p10} 10^${dec(log10, 4)}   ${p2} 2^${dec(log2, 4)}`;
  state.countSpoken = spoken(state.count);
}

function renderOrder() {
  const el = $("orderlabel");
  if (!state.ok) { el.textContent = ""; state.orderTip = ""; return; }
  if (state.shortlex) { el.textContent = "(" + t("orderShortlex") + ")"; state.orderTip = t("orderShortlexHint"); }
  else if (state.infinite) { el.textContent = "(" + t("orderDiagonal") + ")"; state.orderTip = t("orderDiagonalHint"); }
  else { el.textContent = "(" + t("orderPlace") + ")"; state.orderTip = t("orderPlaceHint"); }
}

let lastRows = [];

function renderRows(rows) {
  lastRows = rows;
  const body = $("results").querySelector("tbody");
  const off = state.zeroBased ? 0n : 1n;
  body.innerHTML = rows.map((r) => {
    let out = "";
    if (state.codeActive) {
      out = r.error
        ? `<td class="out err-cell" title="${escapeAttr(r.error)}">!</td>`
        : `<td class="out">${renderValue(r.output || "")}</td>`;
    }
    return `<tr><td class="ix">${group((BigInt(r.index) + off).toString())}</td>` +
           `<td class="val">${renderValue(r.value)}</td>${out}</tr>`;
  }).join("");
  $("status").textContent = rows.length ? "" : (state.ok ? t("pastEnd") : "");
}

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;")
                  .replace(/</g, "&lt;");
}

async function loadRows() {
  if (!state.ok) { renderRows([]); return; }
  const r = await call("rows", { from: state.from.toString(), n: state.per });
  renderRows(r.rows || []);
  syncSlider();
  renderBookmarks();
}

// The bookmarks for the current example: whatever it ships plus whatever the
// user has added for it, each a named jump to an index.
function currentBookmarks() {
  const ex = allExamples().find((e) => e.id === state.selected);
  const built = (ex && ex.bookmarks) || [];
  const mfam = state.selected ? (marks[state.selected] || []) : [];
  return built.map((b) => ({
    name: typeof b.name === "string" ? b.name : (b.name[lang] || b.name.en),
    index: b.index, own: false
  })).concat(mfam.map((b) => ({ name: b.name, index: b.index, own: true })));
}

function renderBookmarks() {
  const box = $("bookmarks");
  const list = currentBookmarks();
  const canAdd = state.ok && !!state.selected;
  let html = list.map((b, i) =>
    `<span class="mark"><button class="markgo" data-i="${i}">` +
    `${escapeAttr(b.name)}</button>` +
    (b.own ? `<button class="markdel" data-i="${i}" title="${t("deleteOne")}">&times;</button>` : "") +
    `</span>`).join("");
  if (canAdd)
    html += `<button id="markadd" title="${t("addBookmark")}">&#9733; +</button>`;
  box.innerHTML = html;
  for (const b of box.querySelectorAll(".markgo"))
    b.onclick = () => { const bm = list[+b.dataset.i]; if (bm) jumpToIndex(bm.index); };
  for (const b of box.querySelectorAll(".markdel"))
    b.onclick = () => { deleteBookmark(list[+b.dataset.i]); };
  const add = $("markadd");
  if (add) add.onclick = openBookmarkBox;
}

// Move to an absolute (zero-based) index, wherever the reader currently is.
function jumpToIndex(index) {
  let v;
  try { v = BigInt(index); } catch { return; }
  setFrom(v < 0n ? 0n : v);
}

function deleteBookmark(bm) {
  if (!state.selected || !bm || !bm.own) return;
  marks[state.selected] = (marks[state.selected] || [])
    .filter((m) => !(m.name === bm.name && m.index === bm.index));
  localStorage.setItem(STORE_MARKS, JSON.stringify(marks));
  renderBookmarks();
}

function openBookmarkBox() {
  if (!state.selected) return;
  $("bmname").value = "";
  // The index shown is the one the reader is looking at, in their numbering.
  $("bmindex").textContent =
    group((state.from + (state.zeroBased ? 0n : 1n)).toString());
  $("bmbox").showModal();
}

function syncSlider() {
  if (state.slider !== "proportion" || !state.count || state.count === "0") return;
  const total = BigInt(state.count);
  const pos = total <= 1n ? 0 :
    Number((state.from * 10000n) / (total > 1n ? total - 1n : 1n));
  $("slider").value = String(Math.max(0, Math.min(10000, pos)));
}

/* ------------------------------------------------------------- navigation */

function setFrom(v) {
  state.from = v < 0n ? 0n : v;
  $("from").value = (state.from + (state.zeroBased ? 0n : 1n)).toString();
  loadRows();
}

function wire() {
  $("lang").innerHTML = Object.entries(LANGS)
    .map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  $("lang").value = lang;
  $("lang").onchange = () => {
    lang = $("lang").value;
    localStorage.setItem(STORE_LANG, lang);
    applyLanguage();
  };

  $("pattern").oninput = () => {
    state.selected = null; renderNote(); renderLibrary(); renderBookmarks();
    scheduleReparse();
  };
  $("code").oninput = () => {
    state.selected = null; renderNote(); renderLibrary(); refreshCodeToggle();
    clearTimeout(reparseTimer);
    reparseTimer = setTimeout(async () => { await applyCode(); loadRows(); }, 300);
  };
  // The </> button folds the code section in and out; a fresh open lands the
  // cursor in it so the reader can start typing at once.
  $("codetoggle").onclick = () => {
    const on = $("codewrap").hidden;
    setCodeVisible(on);
    if (on) $("code").focus();
  };
  $("key").oninput = () => { clearTimeout(reparseTimer); reparseTimer = setTimeout(async () => { await applyKey(); loadRows(); }, 250); };

  $("per").onchange = () => {
    state.per = Math.max(1, Math.min(1000, Number($("per").value) || 50));
    $("per").value = String(state.per);
    loadRows();
  };
  $("zero").onchange = () => {
    state.zeroBased = $("zero").checked;
    $("from").value = (state.from + (state.zeroBased ? 0n : 1n)).toString();
    renderRows(lastRows);
  };
  $("from").onchange = () => {
    let v;
    try { v = BigInt($("from").value.replace(/[^0-9]/g, "") || "0"); } catch { return; }
    setFrom(v - (state.zeroBased ? 0n : 1n));
  };

  $("first").onclick = () => setFrom(0n);
  $("prev").onclick = () => setFrom(state.from - BigInt(state.per));
  $("next").onclick = () => setFrom(state.from + BigInt(state.per));
  $("last").onclick = () => {
    if (!state.count) return;
    setFrom(BigInt(state.count) - BigInt(state.per));
  };
  $("random").onclick = async () => {
    if (!state.count || state.count === "0") return;
    const r = await call("random", { count: state.count, n: state.per });
    renderRows(r.rows || []);
  };

  $("slider").oninput = () => {
    if (state.slider === "length") {
      const L = Number($("slider").value);
      if (!lengthStarts[L]) { setFrom(0n); return; }
      state.sliderTip =
        `${t("sliderAt")} ${L} — ${t("indexCol")} ${group(lengthStarts[L])}`;
      setFrom(BigInt(lengthStarts[L]));
      return;
    }
    if (!state.count) return;
    const total = BigInt(state.count);
    const frac = BigInt($("slider").value);
    setFrom((total - 1n) * frac / 10000n);
  };

  // The wheel moves the window rather than a scrollbar, because the index
  // range is routinely larger than any scrollable height a browser will make.
  // Fine by default -- one element per notch, to pinpoint -- with a middle gear
  // of ten when Ctrl or the middle button is held down while rolling. Coarse
  // movement is the slider's job.
  $("results").onwheel = (e) => {
    if (!state.ok) return;
    e.preventDefault();
    const fast = e.ctrlKey || (e.buttons & 4);
    const step = BigInt(fast ? 10 : 1);
    setFrom(e.deltaY > 0 ? state.from + step : state.from - step);
  };

  $("libsearch").oninput = renderLibrary;
  for (const b of document.querySelectorAll("#libtabs .subtab"))
    b.onclick = () => setFilter(b.dataset.filter);

  // The on-ramp: newcomers land on the first tutorial step, veterans on the
  // first highlight -- each also switching the filter so the neighbours show.
  $("ob-new").onclick = (e) => {
    e.preventDefault();
    setFilter("tutorial");
    const ex = allExamples().find((x) => x.tutorial);
    if (ex) selectExample(ex);
  };
  $("ob-best").onclick = (e) => {
    e.preventDefault();
    setFilter("highlights");
    const ex = allExamples().find((x) => x.highlight);
    if (ex) selectExample(ex);
  };

  $("addown").onclick = () => openSaveBox(null);
  $("savebox").addEventListener("close", saveFromBox);

  // The global tabs switch the left pane between the examples, the helper
  // reference and the dictionaries.
  for (const b of document.querySelectorAll("#tabs .tab")) b.onclick = () => {
    const side = b.dataset.side;
    for (const o of document.querySelectorAll("#tabs .tab"))
      o.classList.toggle("on", o === b);
    show($("examples-view"), side === "examples");
    show($("helpers-view"), side === "helpers");
    show($("dicts-view"), side === "dicts");
  };

  $("adddict").onclick = () => {
    $("dictname").value = "";
    $("dictwords").value = "";
    $("dictfile").value = "";
    $("dictbox").showModal();
  };
  // Loading a file just fills the textarea; the words are read from there.
  $("dictfile").onchange = () => {
    const f = $("dictfile").files[0];
    if (!f) return;
    if (!$("dictname").value) $("dictname").value =
      f.name.replace(/\.(txt|dict)$/i, "").replace(/[^A-Za-z0-9_]/g, "");
    const reader = new FileReader();
    reader.onload = () => { $("dictwords").value = reader.result; };
    reader.readAsText(f);
  };
  $("dictbox").addEventListener("close", saveDictFromBox);

  $("bmbox").addEventListener("close", () => {
    if ($("bmbox").returnValue !== "save") return;
    const name = $("bmname").value.trim();
    if (!name || !state.selected) return;
    // Stored as a zero-based index, whatever numbering was on screen.
    const idx = (state.from).toString();
    (marks[state.selected] = marks[state.selected] || []).push({ name, index: idx });
    localStorage.setItem(STORE_MARKS, JSON.stringify(marks));
    renderBookmarks();
  });
}

// Opens the form for a new example, or for one of your own to be edited. An
// edit keeps the entry's identity so that saving replaces it rather than
// making a second copy of it.
let editing = null;

function openSaveBox(ex) {
  editing = ex && ex.own ? ex : null;
  $("savename").value = editing ? exampleName(editing)
                               : (allExamples().find((e) => e.id === state.selected)
                                    ? exampleName(allExamples().find((e) => e.id === state.selected))
                                    : "");
  $("savenote").value = editing ? exampleNote(editing) : "";
  if (editing) {
    $("pattern").value = (editing.flags ? "(?" + editing.flags + ")" : "") +
                         editing.pattern;
    $("code").value = editing.code || "";
    setCodeVisible(!!editing.code);
    refreshCodeToggle();
  }
  $("savebox").showModal();
}

function saveFromBox() {
  if ($("savebox").returnValue !== "save") { editing = null; return; }
  const name = $("savename").value.trim();
  if (!name) { editing = null; return; }
  const entry = {
    id: editing ? editing.id : "own-" + Date.now(),
    pattern: $("pattern").value,
    flags: currentFlags(),
    name,
    note: $("savenote").value.trim(),
    code: $("code").value.trim(),
    infinite: state.infinite
  };
  const at = editing ? mine.findIndex((m) => m.id === editing.id) : -1;
  if (at >= 0) mine[at] = entry; else mine.push(entry);
  classified.set(entry.id, state.infinite);
  localStorage.setItem(STORE_MINE, JSON.stringify(mine));
  state.selected = entry.id;
  editing = null;
  setFilter("mine");
  renderNote();
}

async function onReady() {
  renderHelpers();
  await classifyExamples();
  if ($("pattern").value) reparse();
  else selectExample(BUILTIN[0]);
}

function saveDictFromBox() {
  if ($("dictbox").returnValue !== "save") return;
  const name = $("dictname").value.trim().replace(/[^A-Za-z0-9_]/g, "");
  const words = $("dictwords").value.split(/\r?\n/)
    .map((w) => w.trim()).filter(Boolean);
  if (!name || !words.length) return;
  const at = myDicts.findIndex((d) => d.id === name);
  const entry = { id: name, name, words };
  if (at >= 0) myDicts[at] = entry; else myDicts.push(entry);
  localStorage.setItem(STORE_DICTS, JSON.stringify(myDicts));
  registerAllDicts().then(() => { renderDicts(); reparse(); });
}

transport.ready(async () => {
  await registerAllDicts();
  ready = true;
  onReady();
});

wire();
attachTip($("pattern"), () => state.note);
attachTip($("count"), () => state.countSpoken);
attachTip($("orderlabel"), () => state.orderTip);
attachTip($("slider"), () => state.sliderTip);
applyLanguage();


createLibrxe().then(function (Module) {
  __rxeEngine = makeEngine(Module, { makeTransform: makeTransform });
  if (__rxeReady) __rxeReady();
}).catch(function (e) { if (__rxeFatal) __rxeFatal(String(e)); });

</script>
