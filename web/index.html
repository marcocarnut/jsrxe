<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rxenum :: regexes as walkable sets</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- a landscape nudge on small portrait screens; gone once an example is tapped -->
<div id="orient">
  <span data-t="orientWarn"></span>
  <button id="orientx" data-ttip="orientDismiss" aria-label="dismiss">&times;</button>
</div>

<header>
  <h1 data-t="title">rxenum</h1>
  <span class="tagline"><span class="sep">::</span>
    <span class="sub" data-t="subtitle"></span></span>
  <span class="repo">(<a id="repo" href="https://github.com/marcocarnut/jsrxe"
     target="_blank" rel="noopener" data-t="repoTag"></a>)</span>
  <select id="lang" aria-label="Language"></select>
</header>

<!-- global navigation: the left pane's content follows the active tab -->
<nav id="tabs">
  <button class="tab on" data-side="examples" data-t="workbench"></button>
  <button class="tab" data-side="helpers" data-t="helpers"></button>
  <button class="tab" data-side="dicts" data-t="dictionaries"></button>
</nav>

<main>

  <aside id="left">

    <!-- on small screens this folds the pane away; the on-ramp below stays -->
    <button id="libtoggle" type="button" aria-controls="left" aria-expanded="true"
            data-t="libraryTitle"></button>

    <!-- the regex example library -->
    <div id="examples-view">
      <h2 class="panetitle" data-t="libraryTitle"></h2>
      <!-- a quiet on-ramp: newcomers to the tutorial, veterans to the best -->
      <p id="onboard">
        <a href="#" id="ob-new" data-t="obNew"></a>
        <span class="sep">·</span>
        <a href="#" id="ob-best" data-t="obBest"></a>
      </p>
      <input id="libsearch" type="search" data-tplace="libSearch">
      <!-- category filters, one icon each; the tooltip names the category -->
      <div id="libtabs">
        <button class="subtab on" data-filter="all" data-ttip="filterAll" aria-label="all">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1"/><rect x="13" y="13" width="7.5" height="7.5" rx="1"/></svg>
        </button>
        <button class="subtab" data-filter="tutorial" data-ttip="filterTutorial" aria-label="tutorial">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 23 8.2 12 13.4 1 8.2Z"/><path d="M5 10.6v4c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M23 8.2v6.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="subtab" data-filter="highlights" data-ttip="filterHighlights" aria-label="highlights">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.7-4.9 4.5 1.3 6.5-5.9-3.3-5.9 3.3 1.3-6.5L2.5 9.2l6.6-.7z"/></svg>
        </button>
        <button class="subtab" data-filter="code" data-ttip="filterCode" aria-label="has code">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/><path d="M13.5 5l-3 14"/></svg>
        </button>
        <button class="subtab" data-filter="finite" data-ttip="filterFinite" aria-label="finite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9.5 4 7.5 20"/><path d="M16.5 4 14.5 20"/><path d="M4.5 9.5H20"/><path d="M4 14.5H19.5"/></svg>
        </button>
        <button class="subtab" data-filter="infinite" data-ttip="filterInfinite" aria-label="infinite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8.3" cy="12" r="3.6"/><circle cx="15.7" cy="12" r="3.6"/></svg>
        </button>
        <button class="subtab" data-filter="mine" data-ttip="filterMine" aria-label="mine">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>
        </button>
      </div>
      <ul id="liblist"></ul>
      <button id="addown" class="wide" data-t="addOwn"></button>
    </div>

    <!-- the helper-function reference for the code section -->
    <div id="helpers-view" hidden>
      <p class="dim" data-t="helpersHint"></p>
      <dl id="helperlist"></dl>
    </div>

    <!-- the word dictionaries, built-in and the user's own -->
    <div id="dicts-view" hidden>
      <p class="dim" data-t="dictsHint"></p>
      <ul id="dictlist"></ul>
      <button id="adddict" class="wide" data-t="addDict"></button>
    </div>

  </aside>

  <!-- the workbench, always present -->
  <section id="work">

    <div class="panel">
      <!-- the enumeration order rides at the right of the label, so it sits
           above the field it describes rather than down by the results -->
      <div class="patlabel">
        <label for="pattern" data-t="patternLabel"></label>
        <span id="orderlabel" class="tip-host"></span>
      </div>
      <div class="patrow">
        <input id="pattern" type="text" spellcheck="false" autocapitalize="off"
               autocomplete="off" data-tplace="patternPlace">
        <button id="codetoggle" type="button" title="">&lt;/&gt;</button>
      </div>
      <div id="err" class="err" hidden></div>
      <!-- the over-cap nudge, kept up here by the input so the set's size,
           which can run to thousands of digits, never scrolls it out of view -->
      <div id="toobig" class="warn" hidden></div>
      <!-- the per-element code, folded in behind the </> button to save a line -->
      <div id="codewrap" hidden>
        <p class="dim" data-t="codeHint"></p>
        <textarea id="code" rows="3" spellcheck="false" autocapitalize="off"
                  autocomplete="off"></textarea>
        <div id="codeerr" class="err" hidden></div>
      </div>
    </div>

    <div class="panel">
      <div class="panelhead">
        <div class="sizehead">
          <h2 data-t="size"></h2>
          <button id="dupinfo" type="button" class="infobtn" aria-label="about this count">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          </button>
        </div>
        <button id="timebtn" type="button" data-ttip="timeBtn" aria-label="time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12"/><path d="M6 20h12"/><path d="M7 4c0 4 3.5 5.5 5 8 1.5-2.5 5-4 5-8"/><path d="M7 20c0-4 3.5-5.5 5-8 1.5 2.5 5 4 5 8"/></svg></button>
      </div>
      <div id="count" class="big tip-host"></div>
      <div id="approx" class="dim"></div>
      <!-- how long to walk the whole set, at a speed you choose -->
      <div id="timebox" hidden>
        <p class="dim" data-t="visitAll"></p>
        <div id="timebig" class="big tip-host"></div>
        <input id="timespeed" type="range" min="0" max="15" step="0.01" value="0">
        <div id="timerate" class="dim"></div>
      </div>
    </div>

    <div class="panel">
      <!-- Elements enumerates by index; Search inverts it, finding the index
           of a string. The two share the results table below; a third tab, the
           parse-tree drawing, is the room this leaves. -->
      <div class="etabs">
        <button class="etab on" data-etab="elements" data-t="elements"></button>
        <button class="etab" data-etab="search" data-t="searchTab"></button>
        <button class="etab" data-etab="tree" data-t="treeTab"></button>
        <button class="etab" data-etab="crack" data-t="crackTab"></button>
      </div>

      <div id="elements-view">
        <div class="controls">
          <label class="ctl"><span data-t="fromIndex"></span>
            <input id="from" type="text" inputmode="numeric" value="0"></label>
          <label class="ctl"><span data-t="perPage"></span>
            <input id="per" type="number" min="1" max="1000" value="50"></label>
        </div>

        <div class="nav">
          <button id="first" class="iconbtn" data-ttip="first" aria-label="first"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6v12"/><path d="M16 7l-6 5 6 5"/></svg></button>
          <button id="prev" class="iconbtn" data-ttip="prev" aria-label="previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button id="random" class="iconbtn" data-ttip="random" aria-label="random"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/></svg></button>
          <button id="next" class="iconbtn" data-ttip="next" aria-label="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          <button id="last" class="iconbtn" data-ttip="last" aria-label="last"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l6 5-6 5"/><path d="M18 6v12"/></svg></button>
          <button type="button" class="zerotgl" aria-pressed="true" data-ttip="zeroOffset" aria-label="numbering">0/1</button>
          <button id="export" class="iconbtn" data-ttip="exportBtn" aria-label="export">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="M7.5 9.5 12 14l4.5-4.5"/><path d="M4 20h16"/></svg>
          </button>
          <button id="share" class="iconbtn" aria-label="share">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 13.5a4.5 4.5 0 0 0 6.4 0l2.6-2.6a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14.5 10.5a4.5 4.5 0 0 0-6.4 0l-2.6 2.6a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
          </button>
          <span id="copied" class="copiedtip" hidden></span>
        </div>

        <div id="bookmarks"></div>

        <div id="coarse">
          <input id="slider" class="tip-host" type="range" min="0" max="10000" value="0">
        </div>
      </div>

      <div id="search-view" hidden>
        <div class="controls">
          <label class="ctl grow"><span data-t="searchFind"></span>
            <input id="findtext" type="text" data-tplace="searchPlace"></label>
          <label class="ctl"><span data-t="searchCap"></span>
            <input id="findcap" type="number" min="1" max="1000" value="50"></label>
          <button type="button" class="zerotgl" aria-pressed="true" data-ttip="zeroOffset" aria-label="numbering">0/1</button>
          <button id="share2" class="iconbtn" aria-label="share">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 13.5a4.5 4.5 0 0 0 6.4 0l2.6-2.6a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14.5 10.5a4.5 4.5 0 0 0-6.4 0l-2.6 2.6a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
          </button>
          <span id="copied2" class="copiedtip" hidden></span>
        </div>
        <div id="searchstatus" class="dim"></div>
      </div>

      <!-- The parse tree, drawn with Cytoscape. Unlike the other two tabs it
           does not use the results table below; it hides it and fills the space
           with an interactive canvas. -->
      <div id="tree-view" hidden>
        <div class="controls">
          <label class="ctl grow"><span data-t="treeIndex"></span>
            <input id="treeidx" type="text" inputmode="numeric" data-tplace="treeIdxPlace"></label>
          <label class="ctl" data-ttip="treeUnrollTip"><span data-t="treeUnroll"></span>
            <input id="treeunroll" type="number" min="0" max="50" value="0"></label>
        </div>
        <div class="nav treenav">
          <button id="treefirst" class="iconbtn" data-ttip="first" aria-label="first"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6v12"/><path d="M16 7l-6 5 6 5"/></svg></button>
          <button id="treeprev" class="iconbtn" data-ttip="prev" aria-label="previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button id="treenext" class="iconbtn" data-ttip="next" aria-label="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          <button id="treelast" class="iconbtn" data-ttip="last" aria-label="last"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l6 5-6 5"/><path d="M18 6v12"/></svg></button>
          <button type="button" class="zerotgl" aria-pressed="true" data-ttip="zeroOffset" aria-label="numbering">0/1</button>
          <button type="button" id="treeassoc" class="iconbtn" aria-pressed="false" data-ttip="treeAssoc" aria-label="associativity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 8H6"/><path d="M10 4 6 8l4 4"/><path d="M4 16h14"/><path d="M14 12l4 4-4 4"/></svg></button>
          <button id="treefit" class="iconbtn" type="button" data-ttip="treeFit" aria-label="fit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg></button>
          <button id="treedir" class="iconbtn" type="button" data-ttip="treeDir" aria-label="rotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/></svg></button>
          <button id="share3" class="iconbtn" aria-label="share">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 13.5a4.5 4.5 0 0 0 6.4 0l2.6-2.6a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14.5 10.5a4.5 4.5 0 0 0-6.4 0l-2.6 2.6a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
          </button>
          <span id="copied3" class="copiedtip" hidden></span>
        </div>
        <div id="treehint" class="dim" data-t="treeHint"></div>
        <div id="cywrap">
          <div id="cy"></div>
          <div id="treemsg" class="dim"></div>
        </div>
      </div>

      <!-- GPU keycracking. Like the Tree tab it takes over the panel, hiding the
           shared results table; a WebGPU compute shader, JIT'd per pattern, lays
           the set's candidates on-device and hashes them. -->
      <div id="crack-view" hidden>
        <div class="controls">
          <label class="ctl"><span data-t="crackHashAlg"></span>
            <select id="crackalg">
              <option value="md5">MD5</option>
              <option value="sha256">SHA-256</option>
              <option value="ntlm">NTLM</option>
              <option value="sha1">SHA-1</option>
            </select></label>
          <button id="crackgo" class="iconbtn" data-ttip="crackGo" aria-label="start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
          <button id="crackstopclear" class="iconbtn" data-ttip="crackClear" aria-label="clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 4.5 11 13"/><path d="M9 11l4 4"/><path d="M13 15l-3.5 3.5a2 2 0 0 1-2.8 0l-1.2-1.2a2 2 0 0 1 0-2.8L9 11"/><path d="M6.2 15.2l2.6 2.6"/></svg></button>
          <button id="crackgears" class="iconbtn" data-ttip="crackKnobs" aria-label="knobs">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <button id="share4" class="iconbtn" aria-label="share">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 13.5a4.5 4.5 0 0 0 6.4 0l2.6-2.6a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14.5 10.5a4.5 4.5 0 0 0-6.4 0l-2.6 2.6a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
          </button>
          <span id="copied4" class="copiedtip" hidden></span>
        </div>
        <label class="ctl grow" for="cracktgts"><span data-t="crackTargets"></span></label>
        <textarea id="cracktgts" rows="4" data-tplace="crackTargetsPlace" spellcheck="false"></textarea>
        <progress id="crackprog" max="1000" value="0" hidden></progress>
        <div id="crackstatus" class="dim"></div>
        <div id="crackout"></div>
      </div>

      <table id="results">
        <thead><tr><th class="ix" data-t="indexCol"></th>
                   <th data-t="valueCol"></th>
                   <th id="outcol" data-t="outputCol" hidden></th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="status" class="dim"></div>
    </div>

    <details class="panel">
      <summary data-t="aboutTitle"></summary>
      <p class="dim" data-t="about"></p>
      <p class="dim">
        <a href="https://github.com/marcocarnut/rxe" target="_blank"
           rel="noopener">github.com/marcocarnut/rxe</a> &mdash;
        <span data-t="repoLib"></span><br>
        <a href="https://github.com/marcocarnut/jsrxe" target="_blank"
           rel="noopener">github.com/marcocarnut/jsrxe</a> &mdash;
        <span data-t="repoApp"></span>
      </p>
    </details>

  </section>
</main>

<!-- floating tooltip, positioned in JavaScript over whatever carries a note -->
<div id="tooltip" hidden></div>

<!-- --------------------------------------------------- save-an-example form -->
<dialog id="savebox">
  <form method="dialog">
    <label><span data-t="addName"></span>
      <input id="savename" type="text" required></label>
    <label><span data-t="addNote"></span>
      <textarea id="savenote" rows="4"></textarea></label>
    <p class="dim" data-t="savedHere"></p>
    <menu>
      <button value="cancel" data-t="addCancel"></button>
      <button id="savego" value="save" data-t="addSave"></button>
    </menu>
  </form>
</dialog>

<!-- ------------------------------------------------------ add-a-dictionary form -->
<dialog id="dictbox">
  <form method="dialog">
    <label><span data-t="dictName"></span>
      <input id="dictname" type="text" required pattern="[A-Za-z0-9_]+"></label>
    <p class="dim" data-t="dictNameHint"></p>
    <label><span data-t="dictWords"></span>
      <textarea id="dictwords" rows="8" spellcheck="false"></textarea></label>
    <p><input id="dictfile" type="file" accept=".txt,.dict,text/plain"></p>
    <p class="dim" data-t="savedHere"></p>
    <menu>
      <button value="cancel" data-t="addCancel"></button>
      <button value="save" data-t="addSave"></button>
    </menu>
  </form>
</dialog>

<!-- ------------------------------------------------------ add-a-bookmark form -->
<dialog id="bmbox">
  <form method="dialog">
    <label><span data-t="bmName"></span>
      <input id="bmname" type="text" required></label>
    <p class="dim"><span data-t="bmAt"></span> <code id="bmindex"></code></p>
    <p class="dim" id="bmkeyline" hidden><span data-t="bmWith"></span>
       <code id="bmkey"></code></p>
    <menu>
      <button value="cancel" data-t="addCancel"></button>
      <button value="save" data-t="addSave"></button>
    </menu>
  </form>
</dialog>

<dialog id="exportbox">
  <form id="exportform">
    <h3 data-t="exportTitle"></h3>
    <p class="dim" id="exportfrom"></p>
    <label><span data-t="exportCount"></span>
      <input id="exportcount" type="text" inputmode="numeric" required></label>
    <label class="check"><input id="exportindex" type="checkbox">
      <span data-t="exportIndex"></span></label>
    <label id="exportcolswrap"><span data-t="exportColumns"></span>
      <select id="exportcols">
        <option value="element" data-t="exportColElement"></option>
        <option value="output" data-t="exportColOutput"></option>
        <option value="both" data-t="exportColBoth" selected></option>
      </select></label>
    <label><span data-t="exportSep"></span>
      <select id="exportsep">
        <option value="tab" data-t="exportSepTab"></option>
        <option value="space" data-t="exportSepSpace"></option>
        <option value="comma" data-t="exportSepComma"></option>
      </select></label>
    <p class="warn" id="exportmem" hidden data-t="exportMem"></p>
    <div id="exportrun" hidden>
      <progress id="exportprog" max="100" value="0"></progress>
      <p class="dim" id="exportstatus"></p>
    </div>
    <menu>
      <button type="button" id="exportcancel" data-t="exportCancel"></button>
      <button type="submit" id="exportgo" data-t="exportGo"></button>
    </menu>
  </form>
</dialog>

<dialog id="crackknobs">
  <form method="dialog">
    <h3 data-t="crackKnobs"></h3>
    <label><span data-t="crackBackend"></span>
      <select id="knobbackend">
        <option value="gpu" selected data-t="crackBackendGpu"></option>
        <option value="wasm" disabled data-t="crackBackendWasm"></option>
        <option value="cpu" data-t="crackBackendCpu"></option>
      </select></label>
    <label><span data-t="crackWorkgroup"></span>
      <select id="knobwg"><option>64</option><option>128</option><option selected>256</option></select></label>
    <label><span data-t="crackCap"></span>
      <select id="knobcap"><option>4096</option><option selected>8192</option><option>16384</option><option>32768</option><option>65535</option></select></label>
    <label><span data-t="crackMode"></span>
      <select id="knobmode">
        <option value="serial" selected data-t="crackModeSerial"></option>
        <option value="interleaved" data-t="crackModeInterleaved"></option>
      </select></label>
    <label><span data-t="crackInterleave"></span>
      <select id="knobww"><option>2</option><option selected>4</option><option>8</option></select></label>
    <menu>
      <button type="submit" data-t="crackKnobsClose"></button>
    </menu>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
